name: Deploy WeatherScope installable web app

on:
  push:
    branches:
      - main
    paths:
      - "backend/web/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out WeatherScope
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the web app
        uses: actions/upload-pages-artifact@v4
        with:
          path: backend/web

      - name: Publish the web app
        id: deployment
        uses: actions/deploy-pages@v4

